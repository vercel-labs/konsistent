name: Release

on:
  push:
    branches:
      - main
    paths:
      - '.changeset/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Publish a snapshot release instead of a normal release'
        type: boolean
        default: false

concurrency:
  group: 'release'
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    # do not attempt running in forks
    if: github.repository_owner == 'vercel-labs'
    steps:
      - name: Configure Git
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Double install: workspace packages expose CLI bins from dist. The bin
      # symlinks can only be created once those dist entrypoints exist, so we
      # install, build the bin producers, wipe node_modules, then reinstall to
      # link the bins. pnpm 11's warm-reinstall skips re-linking if node_modules
      # looks current (--force isn't enough), so the wipe is required. Outside
      # this monorepo, npm/pnpm consumers install already-built tarballs and
      # never hit this.
      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm -F @konsistent/convention build
          pnpm -F konsistent build
          rm -rf node_modules packages/*/node_modules e2e/fixtures/*/node_modules
          pnpm install --frozen-lockfile

      # Normal release path
      - name: Create Release Pull Request or Publish to npm
        if: inputs.snapshot != true
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm ci:version
          publish-script: pnpm ci:release
          # When using "github-api", all commits and tags are GPG-signed and attributed to the user or app who owns the GITHUB_TOKEN
          push-with-git-cli: false

      # Snapshot release path
      - name: Add SHORT_SHA env property with commit short sha
        if: inputs.snapshot == true
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_ENV

      - name: Delete pre.json if it exists
        if: inputs.snapshot == true
        run: rm -f .changeset/pre.json

      - name: Version Packages (snapshot)
        if: inputs.snapshot == true
        run: pnpm changeset version --snapshot ${SHORT_SHA}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        if: inputs.snapshot == true
        run: pnpm build

      - name: Publish Snapshot Release
        if: inputs.snapshot == true
        run: pnpm changeset publish --no-git-tag --tag snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
