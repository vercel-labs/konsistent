# Verifies that any PR which modifies non-test source files in `packages/*` ships
# with at least one new changeset, and that every changeset only contains `patch`
# bumps (the repository stays permanently on `0.0.1-alpha.*`).
name: Verify Changesets

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-changesets:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.type != 'Bot' || !startsWith(github.event.pull_request.head.ref, 'changeset-release/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Collect changed files
        id: changed
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          {
            echo "package-files<<__EOF__"
            git diff --name-only "$BASE_SHA" -- 'packages/**' \
              | grep -v -E '(^|/)(__tests__|__mocks__|__fixtures__|tests?|fixtures)/' \
              | grep -v -E '\.(test|spec|e2e)\.[cm]?[jt]sx?$' \
              || true
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
          {
            echo "added-changesets<<__EOF__"
            git diff --name-only --diff-filter=A "$BASE_SHA" -- ':(glob).changeset/*.md' \
              | grep -v -E '^\.changeset/README\.md$' \
              || true
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
          {
            echo "all-changesets<<__EOF__"
            git diff --name-only --diff-filter=ACMRT "$BASE_SHA" -- ':(glob).changeset/*.md' \
              | grep -v -E '^\.changeset/README\.md$' \
              || true
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
      - name: Verify changesets
        run: node tools/scripts/verify-changesets.mjs
        env:
          PACKAGE_FILES: ${{ steps.changed.outputs.package-files }}
          ADDED_CHANGESETS: ${{ steps.changed.outputs.added-changesets }}
          ALL_CHANGED_CHANGESETS: ${{ steps.changed.outputs.all-changesets }}
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
