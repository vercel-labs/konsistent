packages:
  - "packages/*"
  - "e2e/fixtures/reusable-convention-string-ref-pkg"
  - "e2e/fixtures/reusable-convention-string-ref-pkg-broken"
  - "e2e/fixtures/reusable-convention-object-ref-pkg"
  - "e2e/fixtures/reusable-convention-object-ref-pkg-broken"
  - "e2e/fixtures/reusable-convention-merge-overrides-pkg"
  - "e2e/fixtures/reusable-convention-merge-overrides-pkg-broken"
  - "e2e/fixtures/reusable-convention-unknown-source"
  - "e2e/fixtures/config-package-source"
  - "e2e/fixtures/config-package-consumer"

catalog:
  "@types/node": "^26.6.4"
  ajv: "^8.20.0"
  citty: "^0.2"
  del-cli: "^7.0.0"
  esbuild: "^0.28.1"
  tsdown: "^0.23.0"
  tsx: "^4.23.15"
  typescript: "7.0.2"
  vite: "^7.3.5"
  vitest: "^5.0.3"
  zod: "^4.6.5"

overrides:
  esbuild: "catalog:"
  fast-uri: "^3.1.5"
  "read-yaml-file@1>js-yaml": "^3.15.1"
  "@changesets/parse>js-yaml": "^4.3.1"
  brace-expansion: "^5.0.7"
  vite: "catalog:"

allowBuilds:
  esbuild: true

minimumReleaseAge: 2880 # 2 days

minimumReleaseAgeExclude:
  - 'turbo'
  - 'konsistent'
  - '@konsistent/*'
